# Definición del proyecto para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# El .xcodeproj NO se guarda en git: GitHub Actions lo genera con `xcodegen generate`.
name: Descargador

options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Commit corto; GitHub Actions lo sobrescribe al compilar.
    GIT_COMMIT: local
    # Solo iPhone.
    TARGETED_DEVICE_FAMILY: "1"
    # Sin equipo de desarrollo: firma ad hoc en simulador; el .ipa se compila sin firmar
    # y SideStore/AltStore lo firma con tu Apple ID al instalarlo.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Los scripts de fase de compilación (Etapa 2: Python) necesitan acceso al disco.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Descargador:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    # Python para iOS (BeeWare). Lo descarga scripts/ci/preparar_python.sh; no está en git.
    dependencies:
      - framework: Python.xcframework
        embed: true
      # Descargador en la hoja de Compartir (se incrusta en PlugIns/).
      - target: CompartirExtension
    # Mete la biblioteca estándar, yt-dlp y App/python dentro de la app (ver el script).
    postBuildScripts:
      - name: Instalar Python
        script: bash "$PROJECT_DIR/scripts/instalar_python_en_app.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Descargador
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        DescargadorCommit: $(GIT_COMMIT)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Esquema descargador://download?url=...
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.descargador
            CFBundleURLSchemes:
              - descargador
        # Muestra la carpeta Documents de la app en la app Archivos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # Guardar en Fotos (permiso "solo añadir").
        NSPhotoLibraryAddUsageDescription: Para guardar en Fotos los videos que descargas.
        # "Mantener activo": audio silencioso mientras descarga para que iOS no pause la app.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.descargador
        PRODUCT_NAME: Descargador
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Puente en C hacia Python (App/Sources/Python).
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Python/Descargador-Bridging-Header.h
        # Las cabeceras de Python usan #include "…" dentro del framework: no es un error.
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO

  # Extensión de Compartir: toma el enlace y abre la app con descargador://download?url=…
  CompartirExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Misma lógica de enlaces que la app (compilada también aquí).
      - path: App/Sources/Nucleo/Enlaces.swift
      - path: App/Sources/Nucleo/Calidad.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Descargador
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ControladorCompartir
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.descargador.compartir
        PRODUCT_NAME: DescargadorCompartir
        # Xcode exige API solo de extensiones; la app se abre por el runtime de Objective-C
        # (ver ControladorCompartir.abrirDescargador).
        APPLICATION_EXTENSION_API_ONLY: YES

  # Tests unitarios de la lógica (se ejecutan en el simulador de GitHub Actions).
  DescargadorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unitarias
    dependencies:
      - target: Descargador
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.descargador.tests

  # Tests de interfaz: recorren la app y guardan capturas de cada pantalla.
  DescargadorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Descargador
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.descargador.uitests
        TEST_TARGET_NAME: Descargador

schemes:
  Descargador:
    build:
      targets:
        Descargador: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DescargadorTests
        - DescargadorUITests
    archive:
      config: Release
