# Compila Descargador en un Mac de GitHub (gratis en repositorios públicos).
#
#  - compilar:  genera Descargador.ipa SIN FIRMAR (artifact) y, en tags v*, lo publica en Releases.
#  - simulador: ejecuta los tests en un iPhone simulado con iOS 18 y sube capturas de cada pantalla.
#  - python:    tests del código Python de la app (rápido, en Linux).
#
# Si algo falla, abre la ejecución y mira primero la pestaña "Summary": ahí aparecen
# los errores resumidos. El log completo se sube como artifact.
name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Si haces dos push seguidos, se cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Por defecto, solo lectura. El job "compilar" pide escritura para publicar Releases.
permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  compilar:
    name: Compilar .ipa (iPhone)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # necesario solo para publicar Releases en tags v*
    env:
      XCODE_VERSION: "26.6"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar herramientas (XcodeGen, xcbeautify, Xcode)
        run: bash scripts/ci/instalar_herramientas.sh

      - name: Instalar Python 3.14 en el runner
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Preparar Python para iOS (BeeWare + yt-dlp)
        run: bash scripts/ci/preparar_python.sh

      - name: Generar proyecto con XcodeGen
        run: xcodegen generate

      - name: Compilar y empaquetar .ipa
        run: bash scripts/ci/compilar_ipa.sh

      - name: Subir .ipa
        uses: actions/upload-artifact@v7
        with:
          name: Descargador-ipa-${{ github.run_number }}
          path: build/Descargador.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Subir log de compilación (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-compilacion
          path: build/logs/
          if-no-files-found: ignore

      - name: Publicar en Releases (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Descargador.ipa --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/Descargador.ipa \
              --title "Descargador $GITHUB_REF_NAME" --generate-notes
          fi

  simulador:
    name: Probar en simulador (iOS 18)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      XCODE_VERSION: "26.3"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar herramientas (XcodeGen, xcbeautify, Xcode)
        run: bash scripts/ci/instalar_herramientas.sh

      - name: Instalar Python 3.14 en el runner
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Preparar Python para iOS (BeeWare + yt-dlp)
        run: bash scripts/ci/preparar_python.sh

      - name: Generar proyecto con XcodeGen
        run: xcodegen generate

      - name: Ejecutar tests en el simulador
        run: bash scripts/ci/probar_simulador.sh

      - name: Subir capturas del simulador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-simulador
          path: build/capturas/
          if-no-files-found: warn
          retention-days: 30

      - name: Subir resultados de los tests (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-tests
          path: |
            build/Resultados.xcresult
            build/logs/
          if-no-files-found: ignore

  python:
    name: Tests de Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar yt-dlp y dependencias
        run: python -m pip install --quiet --disable-pip-version-check -r python/requisitos-ios.txt

      - name: Ejecutar tests
        run: python scripts/probar_python.py
